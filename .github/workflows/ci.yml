name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Bundle (ad-hoc signed)
        run: make bundle
